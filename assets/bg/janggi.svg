<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <!-- 장기 배경 — 한지/나뭇결 질감. 사진 대신 필터로 그려 용량이 몇 KB 뿐이다.
       CSS 에서 어두운 스크림이 위에 덮이므로 여기서는 대비를 넉넉히 준다. -->
  <defs>
    <!-- 가로로 길게 늘인 노이즈 = 한지 섬유결 -->
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.7" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    </filter>
    <!-- 잘게 낀 종이 알갱이 -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
    </filter>
    <!-- 세로 나뭇결 -->
    <filter id="woodgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5 0.006" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
    <radialGradient id="glow" cx="50%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#e6c489"/>
      <stop offset="60%" stop-color="#c39a5e"/>
      <stop offset="100%" stop-color="#7d5a2e"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1600" fill="url(#glow)"/>
  <rect width="1200" height="1600" filter="url(#woodgrain)" opacity=".55"/>
  <rect width="1200" height="1600" filter="url(#fiber)" opacity=".45"/>
  <rect width="1200" height="1600" filter="url(#grain)" opacity=".5"/>

  <!-- 장기판 격자를 크게 흐릿하게 앉혀 '장기' 라는 느낌만 준다 -->
  <g stroke="#5c3f1d" stroke-width="3" opacity=".18" fill="none">
    <g id="grid">
      <path d="M240 420 H960 M240 520 H960 M240 620 H960 M240 720 H960 M240 820 H960
               M240 920 H960 M240 1020 H960 M240 1120 H960 M240 1220 H960 M240 420 V1220"/>
      <path d="M330 420 V1220 M420 420 V1220 M510 420 V1220 M600 420 V1220
               M690 420 V1220 M780 420 V1220 M870 420 V1220 M960 420 V1220"/>
      <!-- 궁성 대각선 -->
      <path d="M510 420 L690 620 M690 420 L510 620 M510 1020 L690 1220 M690 1020 L510 1220"/>
    </g>
  </g>

  <!-- 가장자리 어둡게(비네트) — 화면 끝이 자연스럽게 잠긴다 -->
  <radialGradient id="vig" cx="50%" cy="45%" r="75%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".45"/>
  </radialGradient>
  <rect width="1200" height="1600" fill="url(#vig)"/>
</svg>
